name: birdclef
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - librosa>=0.10
  - scikit-learn
  - pandas
  - matplotlib
  - seaborn
  - tqdm
  - ipykernel
  - jupyter
  - pip
  - pip:
    - timm       # pretrained CNN/ViT backbones
    - einops     # tensor reshaping for Transformer blocks
    - soundfile
