# HP search config for cnn_baseline (PROBLEMSETTING.md §HP Tuning)
#
# ResNet-18 baseline. Tunes LR and augmentation strength.
# Depth (ResNet-18 vs ResNet-34) could be added by extending cnn_baseline.py
# to accept a model_name kwarg.
#
# Budget target: 4 trials × 3 epochs × K=69 subset ≈ 2–3h on a single GPU.

model_hp_keys: []

fixed:
  epochs: 3
  warmup_epochs: 0
  label_smoothing: 0.0
  batch_size: 64
  grad_clip: 1.0
  data_subset_min_recordings: 200

data_subset_min_recordings: 200

hp_space:
  lr: [3.0e-4, 1.0e-3, 3.0e-3]
  weight_decay: [1.0e-5, 1.0e-4, 1.0e-3]
