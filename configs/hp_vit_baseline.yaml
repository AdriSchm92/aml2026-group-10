# HP search config for vit_baseline (PROBLEMSETTING.md §HP Tuning)
#
# ViT-Small from scratch. Tunes dropout, LR, and weight decay.
# drop_path_rate and drop_rate are forwarded to build_model via model_hp_keys.
#
# Budget target: 6 trials × 5 epochs × K=69 subset ≈ 4–6h on a single GPU.

model_hp_keys:
  - drop_path_rate
  - drop_rate

fixed:
  epochs: 5
  warmup_epochs: 2
  label_smoothing: 0.1
  batch_size: 128
  num_workers: 10
  grad_clip: 1.0
  data_subset_min_recordings: 200

data_subset_min_recordings: 200

hp_space:
  drop_path_rate: [0.05, 0.1, 0.2]
  drop_rate: [0.05, 0.1]
  lr: [1.0e-4, 3.0e-4, 1.0e-3]
  weight_decay: [1.0e-2, 5.0e-2]
